name: Find jobs

on:
  schedule:
    # 20:00 UTC = 6am Melbourne (AEST) / 7am (AEDT)
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Find and rank jobs
        run: node scripts/find_jobs.mjs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit updated jobs.json
        run: |
          git config user.name "job-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "Update jobs $(date -u +%Y-%m-%d)"
          git push
